name: Publish
on:
  release:
    types: [published]

permissions:
  id-token: write  # Required for OIDC https://docs.npmjs.com/trusted-publishers
  contents: read


jobs:
  dry-run:
    name: NPM Dry Run
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.DEFAULT_JOB_TIMEOUT_MINUTES) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version
      - run: npm ci
      - name: Check formatting
        run: make format-check
      - name: Dry run publish
        if: github.actor != 'dependabot[bot]'
        run: npm publish --dry-run

  publish:
    name: Publish to NPM
    needs: dry-run
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: ${{ fromJSON(vars.DEFAULT_JOB_TIMEOUT_MINUTES) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"
          always-auth: true
          cache: npm
      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version
      - run: npm ci
      # Ensure npm 11.5.1 or later is installed
      - name: Publish
        run: npx --yes npm@latest publish --provenance --access public
